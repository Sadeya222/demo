    C24.5,30 17.5,31 11,33 Z"/>

  <!-- lower lip -->
  <path fill="url(#lowerGrad)" stroke="#9d174d" stroke-width="1" stroke-linejoin="round" d="
    M11,33
    C17.5,35.5 24.5,36.5 32,36.5
    C39.5,36.5 46.5,35.5 53,33
    C51,43.5 44.5,50.5 32,50.5
