<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f775ac"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="lowerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5438c"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="tongueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.6" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- upper lip -->
  <path fill="url(#lipGrad)" stroke="#9d174d" stroke-width="1" stroke-linejoin="round" d="
    M11,33
    C13,27.5 16.5,23.5 21.5,22.5
