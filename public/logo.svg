  <ellipse cx="27.5" cy="40" rx="4.2" ry="2" transform="rotate(-16 27.5 40)" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="28.5" cy="48" rx="2.8" ry="1.4" transform="rotate(-8 28.5 48)" fill="#ffffff" opacity="0.25"/>
